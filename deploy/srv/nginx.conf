server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;   # a bare `types {}` block would replace the defaults
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain model/gltf-binary model/gltf+json;
    gzip_min_length 1024;

    # The sync rewrites these in place; never let a browser keep an old index.
    location ~ ^/(index\.html|sources\.html|sources\.json|props\.json|sources/) { add_header Cache-Control "no-cache"; }
    location /viewer/ { add_header Cache-Control "no-cache"; }
    # Regenerated assets keep their names (model.glb, ref.png), so revalidate rather than pin.
    location /out/ { alias /srv/out/; add_header Cache-Control "no-cache"; autoindex off; }
    location = /sw.js { return 404; }
    location / { try_files $uri $uri/ =404; }
}
