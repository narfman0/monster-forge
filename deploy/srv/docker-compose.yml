# Private monster-forge host (LAN only, no Caddy route): the viewer + every source's out/ assets.
# Installed at /media/data/other/monster-forge on srv. Written by `tools/sync_assets.py --dest srv:<this dir>`:
#   ./site   landing page, viewer/, sources.json, sources/<s>/index.json
#   ./out    assets, mirrored from the repo's out/<s>/ (never in git)
services:
  monster-forge:
    image: nginx:1.27-alpine
    container_name: monster-forge
    ports:
      - "0.0.0.0:5070:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./out:/srv/out:ro   # aliased at /out/ (a nested mount inside the ro site dir cannot be created)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
